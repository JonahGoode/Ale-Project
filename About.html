     <script>
    document.addEventListener('DOMContentLoaded', function() {
        const portfolioTrigger = document.querySelector('.portfolio-trigger');
        const dropdownMenu = document.querySelector('.dropdown-menu');
        
        // Toggle dropdown on click
        portfolioTrigger.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            // Toggle active class on trigger for arrow rotation
            this.classList.toggle('active');
            
            // Toggle dropdown visibility
            dropdownMenu.classList.toggle('active');
        });
    
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!portfolioTrigger.contains(e.target) && !dropdownMenu.contains(e.target)) {
                dropdownMenu.classList.remove('active');
                portfolioTrigger.classList.remove('active');
            }
        });
    
        // Prevent dropdown from closing when clicking inside it
        dropdownMenu.addEventListener('click', function(e) {
            e.stopPropagation();
        });
    
        // Add keyboard navigation
        dropdownMenu.querySelectorAll('a').forEach((link, index, links) => {
            link.addEventListener('keydown', function(e) {
                let targetItem;
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    targetItem = links[index + 1] || links[0];
                }
                
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    targetItem = links[index - 1] || links[links.length - 1];
                }
                
                if (e.key === 'Escape') {
                    portfolioTrigger.focus();
                    dropdownMenu.classList.remove('active');
                    portfolioTrigger.classList.remove('active');
                }
                
                targetItem?.focus();
            });
        });
    
        // Close dropdown on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                dropdownMenu.classList.remove('active');
                portfolioTrigger.classList.remove('active');
            }
        });
    });
    

     </script>
